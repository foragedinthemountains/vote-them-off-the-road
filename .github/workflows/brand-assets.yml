name: Generate brand PNGs from SVG sources
on:
  push:
    branches: [main]
    paths:
      - 'assets/brand/*.svg'
      - 'scripts/generate_brand_assets.py'
      - '.github/workflows/brand-assets.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install SVG renderer
        run: python -m pip install 'cairosvg==2.7.1'
      - name: Render PNGs
        run: python scripts/generate_brand_assets.py
      - name: Commit generated brand files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/app-192.png assets/app-512.png assets/brand/apple-touch-180.png assets/brand/social-default.png
          if ! git diff --cached --quiet; then
            git commit -m "chore: render canonical brand PNGs [skip ci]"
            git push
          fi
